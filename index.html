<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AIA Canada and I-CAR Canada team</title>
<link rel="icon" href="/assets/aia-canada-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&display=swap">
<link rel="stylesheet" href="/styles.css?v=20261027c">
<script>
  // Runs before anything renders.
  (function () {
    var q = location.search, h = location.hash;
    // Older confirmation and password-reset emails, and admin "Edit" links, pointed here: send them to the editor.
    if (/[?&](code|id|token_hash|error_description)=/.test(q) || /access_token=|type=recovery|error_description=/.test(h)) {
      location.replace("/edit.html" + q + h); return;
    }
    // A phone with a default card opens it straight away, unless someone chose "Search the team".
    try {
      var slug = localStorage.getItem("my-card-slug");
      if (slug && !/[?&]browse=1/.test(q) && /^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) location.replace("/" + slug + "?me=1");
    } catch (e) {}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=20261027c"></script>
<script src="/shared.js?v=20261027c"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="logos">
      <img class="logo" src="/assets/aia-canada-logo.png" alt="AIA Canada">
      <img class="logo logo-icar" src="/assets/icar-canada-logo.png" alt="I-CAR Canada">
    </div>
    <div class="right">
      <div class="seg" role="group" aria-label="Language" id="langSeg">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>

  <h1 data-i18n="findTitle"></h1>
  <p class="muted" data-i18n="findIntro" style="margin-top:0"></p>

  <a class="default-banner" id="defaultBanner" hidden></a>

  <div class="finder">
    <label for="q" class="sr-only" data-i18n="searchLabel"></label>
    <input type="search" id="q" autocomplete="off" enterkeyhint="search">
    <div class="seg" role="group" aria-label="Organization" id="orgSeg">
      <button type="button" data-org="" aria-pressed="true" data-i18n="allOrgs"></button>
      <button type="button" data-org="aia" aria-pressed="false">AIA Canada</button>
      <button type="button" data-org="icar" aria-pressed="false">I-CAR Canada</button>
    </div>
  </div>

  <p class="hint" id="count" aria-live="polite"></p>
  <ul class="people" id="people"></ul>
  <p class="panel" id="empty" hidden></p>

  <p class="foot"><a href="/edit.html" data-i18n="staffLink"></a></p>
</div>

<script>
(async function () {
  const K = window.Cards;
  const $ = id => document.getElementById(id);
  let lang = (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
  try { const s = localStorage.getItem("card-ui-lang"); if (s === "en" || s === "fr") lang = s; } catch (e) {}
  const t = k => K.T[lang][k];
  let people = [], org = "", loaded = false, failed = false;

  const fold = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function draw() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.querySelectorAll("#orgSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.org === org)));
    $("q").placeholder = t("searchLabel");

    // Default card on this phone (reached here through "Search the team")
    const def = K.getDefault();
    const defP = def && people.find(p => p.slug === def);
    $("defaultBanner").hidden = !def;
    if (def) {
      $("defaultBanner").href = "/" + def + "?me=1";
      $("defaultBanner").textContent = t("defaultOn") + ": " + (defP ? defP.first_name + " " + defP.last_name : "/" + def) + " →";
    }

    if (failed) { $("empty").hidden = false; $("empty").textContent = t("loadError"); $("count").textContent = ""; return; }
    if (!loaded) return;

    const words = fold($("q").value).split(/\s+/).filter(Boolean);
    const list = people.filter(p => {
      if (org && p.org !== org) return false;
      const hay = fold([p.first_name, p.last_name, p.title_en, p.title_fr, K.BRANDS[p.org].name].join(" "));
      return words.every(w => hay.includes(w));
    });

    $("count").textContent = list.length === 1 ? t("resultsOne") : t("resultsCount").replace("{n}", list.length);
    $("empty").hidden = list.length > 0; $("empty").textContent = t("noResults");
    const ul = $("people"); ul.innerHTML = "";
    list.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a"); a.href = "/" + p.slug + (lang !== p.lang ? "?lang=" + lang : "");
      const ph = K.photoUrl(p);
      let av;
      if (ph) { av = document.createElement("img"); av.src = ph; av.alt = ""; av.loading = "lazy"; }
      else { av = document.createElement("span"); av.textContent = (p.first_name[0] + p.last_name[0]).toUpperCase(); av.setAttribute("aria-hidden", "true"); }
      av.className = "person-avatar person-" + p.org;
      const txt = document.createElement("span"); txt.className = "person-text";
      const n = document.createElement("strong"); n.textContent = p.first_name + " " + p.last_name;
      const ti = document.createElement("span"); ti.className = "person-title"; ti.textContent = K.title(p, lang) || "";
      const o = document.createElement("span"); o.className = "person-org"; o.textContent = K.BRANDS[p.org].name;
      txt.append(n, ti, o);
      a.append(av, txt);
      li.append(a); ul.append(li);
    });
  }

  document.querySelectorAll("#langSeg button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("card-ui-lang", lang); } catch (e) {} draw();
  }));
  document.querySelectorAll("#orgSeg button").forEach(b => b.addEventListener("click", () => { org = b.dataset.org; draw(); }));
  $("q").addEventListener("input", draw);
  draw();

  if (!K.configured()) { failed = true; draw(); return; }
  try {
    const { data, error } = await K.client().from("profiles")
      .select("slug, org, lang, first_name, last_name, title_en, title_fr, photo_path, updated_at")
      .eq("published", true).order("last_name").order("first_name");
    if (error) throw error;
    people = data; loaded = true;
  } catch (e) { failed = true; }
  draw();
})();
</script>
</body>
</html>
